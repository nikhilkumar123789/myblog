baseURL = "https://versesofawanderer.netlify.app/"
title = "Verses of a wanderer"
theme = "PaperMod"
locale = "en-us"
paginate = 8
summaryLength = 120
enableRobotsTXT = true

[params]
  author = "Nikhil"
  description = "Essays, notes, and quiet observations from a life in motion."
  keywords = ["personal blog", "writing", "reflections", "nature", "travel", "mindfulness"]
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowWordCount = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  disableComments = false
  mainSections = ["posts"]

  [params.homeInfoParams]
    Title = "Wander softly. Write honestly."
    Content = "Thoughts on growth, mountains, memory, and the quiet rituals that shape a life."

[menu]
  [[menu.main]]
    name = "Home"
    pageRef = "/"
    weight = 1
  [[menu.main]]
    name = "Categories"
    pageRef = "/categories/"
    weight = 2
  [[menu.main]]
    name = "Tags"
    pageRef = "/tags/"
    weight = 3
  [[menu.main]]
    name = "About"
    pageRef = "/about/"
    weight = 4

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[taxonomies]
  category = "categories"
  tag = "tags"
